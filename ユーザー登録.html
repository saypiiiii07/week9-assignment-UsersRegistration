<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ユーザー登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-sky-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
      <h1 class="text-xl font-bold mb-6">ユーザー登録</h1>

      <form id="signupForm" class="space-y-4" novalidate>
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
            氏名
          </label>
          <input
            type="text"
            id="name"
            required
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="山田太郎"
          >
          <p id="nameError" class="text-sm text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            メールアドレス
          </label>
          <input
            type="email"
            id="email"
            required
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="example@mail.com"
          >
          <p id="emailError" class="text-sm text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            パスワード（8文字以上）
          </label>
          <input
            type="password"
            id="password"
            required
            minlength="8"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          >
          <p id="passwordError" class="text-sm text-red-500 mt-1 hidden"></p>
        </div>

        <div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="agree">
            <label for="agree" class="text-sm text-gray-700">
              利用規約に同意する
            </label>
          </div>
          <p id="agreeError" class="text-sm text-red-500 mt-1 hidden"></p>
        </div>

        <p id="message" class="text-sm font-medium"></p>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700"
        >
          登録する
        </button>
      </form>
    </div>

    <script>
      const form = document.getElementById("signupForm");
      const message = document.getElementById("message");

      const errorEls = {
        name: document.getElementById("nameError"),
        email: document.getElementById("emailError"),
        password: document.getElementById("passwordError"),
        agree: document.getElementById("agreeError"),
      };

      function showError(field, text) {
        errorEls[field].textContent = text;
        errorEls[field].classList.remove("hidden");
      }

      function clearError(field) {
        errorEls[field].textContent = "";
        errorEls[field].classList.add("hidden");
      }

      function clearAllErrors() {
        Object.keys(errorEls).forEach(clearError);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearAllErrors();
        message.textContent = "";

        const name = document.getElementById("name").value.trim();   // 前後の空白を除く
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;  // パスワードは空白も意味を持つのでtrimしない
        const agree = document.getElementById("agree").checked;

        let hasError = false;

        if (name === "") {
          showError("name", "お名前を入力してください");
          hasError = true;
        }

        if (email === "") {
          showError("email", "メールアドレスを入力してください");
          hasError = true;
        }

        if (password.length < 8) {
          showError("password", "パスワードは8文字以上で入力してください");
          hasError = true;
        }

        if (!agree) {
          showError("agree", "利用規約に同意してください");
          hasError = true;
        }

        if (hasError) {
          return;
        }

        message.textContent = "登録完了！ようこそ、" + name + " さん！";
        message.className = "text-sm font-medium text-green-600";
      });
    </script>
  </body>
</html>
